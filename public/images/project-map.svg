<svg
  width="1000"
  height="650"
  viewBox="0 0 1000 650"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="SV Portfolio project architecture map"
>
  <defs>
    <marker
      id="arrow"
      markerWidth="10"
      markerHeight="10"
      refX="8"
      refY="5"
      orient="auto"
      markerUnits="strokeWidth"
    >
      <path d="M0,0 L10,5 L0,10 Z" fill="#2d3748" />
    </marker>
    <style>
      .box {
        fill: #edf2f7;
        stroke: #4a5568;
        stroke-width: 2;
        rx: 16;
        ry: 16;
      }
      .title {
        font: 700 18px sans-serif;
        fill: #2d3748;
      }
      .text {
        font: 400 14px sans-serif;
        fill: #4a5568;
      }
      .label {
        font: 500 12px sans-serif;
        fill: #2d3748;
      }
      .bg {
        fill: #f7fafc;
      }
      .section {
        fill: #e2e8f0;
        stroke: #cbd5e0;
        stroke-width: 1;
        rx: 12;
        ry: 12;
      }
      .line {
        stroke: #4a5568;
        stroke-width: 2;
        marker-end: url(#arrow);
      }
    </style>
  </defs>

  <rect x="20" y="20" width="960" height="110" class="bg" />
  <text x="40" y="50" class="title">Project Map</text>
  <text x="40" y="76" class="text">
    High-level architecture diagram for the SV Portfolio website.
  </text>

  <rect x="90" y="160" width="240" height="90" class="box" />
  <text x="120" y="195" class="title">Browser</text>
  <text x="120" y="220" class="text">React client</text>
  <text x="120" y="240" class="text">Router + UI</text>

  <rect x="390" y="160" width="240" height="90" class="box" />
  <text x="430" y="195" class="title">src/main.tsx</text>
  <text x="430" y="220" class="text">App entry / RouterProvider</text>
  <text x="430" y="240" class="text">Global CSS imports</text>

  <rect x="690" y="160" width="240" height="90" class="box" />
  <text x="740" y="195" class="title">src/App.tsx</text>
  <text x="740" y="220" class="text">Layout wrapper</text>
  <text x="740" y="240" class="text">Header / Footer / Outlet</text>

  <line x1="310" y1="205" x2="390" y2="205" />
  <line x1="630" y1="205" x2="690" y2="205" />

  <rect x="90" y="320" width="260" height="120" class="box" />
  <text x="120" y="355" class="title">src/router.tsx</text>
  <text x="120" y="380" class="text">Route definitions</text>
  <text x="120" y="400" class="text">Navigation config</text>

  <rect x="385" y="320" width="260" height="120" class="box" />
  <text x="430" y="355" class="title">src/pages/</text>
  <text x="430" y="380" class="text">Home, Projects,</text>
  <text x="430" y="400" class="text">AboutMe, Contact</text>

  <rect x="680" y="320" width="260" height="120" class="box" />
  <text x="720" y="355" class="title">src/features/</text>
  <text x="720" y="380" class="text">Nav links, buttons,</text>
  <text x="720" y="400" class="text">project cards, forms</text>

  <line x1="210" y1="260" x2="210" y2="320" />
  <line x1="280" y1="260" x2="280" y2="320" />
  <line x1="510" y1="260" x2="510" y2="320" />
  <line x1="780" y1="260" x2="780" y2="320" />

  <rect x="420" y="470" width="540" height="120" class="section" />
  <text x="450" y="505" class="title">Styling & state</text>
  <text x="450" y="530" class="text">Tailwind + RippleUI +</text>
  <text x="450" y="550" class="text">CSS variables / dark mode</text>
  <text x="450" y="570" class="text">Theme provider / localStorage</text>

  <line x1="610" y1="440" x2="610" y2="470" />
  <line x1="210" y1="440" x2="520" y2="470" />

  <rect x="90" y="470" width="260" height="120" class="section" />
  <text x="120" y="505" class="title">Data & config</text>
  <text x="120" y="530" class="text">Navigation, buttons, socials</text>
  <text x="120" y="550" class="text">Project list / constants</text>
  <text x="120" y="570" class="text">Route titles and labels</text>

  <rect x="310" y="470" width="260" height="120" class="section" />
  <text x="340" y="505" class="title">Utilities</text>
  <text x="340" y="530" class="text">Hooks, helpers,</text>
  <text x="340" y="550" class="text">responsive behavior</text>
  <text x="340" y="570" class="text">page title + scroll reset</text>
</svg>
