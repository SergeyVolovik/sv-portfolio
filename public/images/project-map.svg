<svg
  width="1000"
  height="650"
  viewBox="0 0 1000 650"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="SV Portfolio project architecture map"
>
  <defs>
    <marker
      id="arrow"
      markerWidth="10"
      markerHeight="10"
      refX="8"
      refY="5"
      orient="auto"
      markerUnits="strokeWidth"
    >
      <path d="M0,0 L10,5 L0,10 Z" fill="#2d3748" />
    </marker>

    <style>
      .bg {
        fill: #f7fafc;
      }

      .box {
        fill: #edf2f7;
        stroke: #4a5568;
        stroke-width: 2;
      }

      .section {
        fill: #e2e8f0;
        stroke: #cbd5e0;
        stroke-width: 1.5;
      }

      .title {
        font: 700 18px sans-serif;
        fill: #2d3748;
      }

      .text {
        font: 400 14px sans-serif;
        fill: #4a5568;
      }

      .label {
        font: 500 12px sans-serif;
        fill: #2d3748;
      }

      .line {
        stroke: #4a5568;
        stroke-width: 2;
        fill: none;
        marker-end: url(#arrow);
      }
    </style>
  </defs>

  <!-- Header -->
  <rect x="20" y="20" width="960" height="105" rx="16" class="bg" />

  <text x="50" y="55" class="title">Project Map</text>

  <text x="50" y="82" class="text">
    High-level architecture diagram for the SV Portfolio website.
  </text>

  <text x="50" y="103" class="label">
    React · React Router · Tailwind · dark mode
  </text>

  <!-- Application flow -->
  <rect x="60" y="155" width="260" height="95" rx="16" class="box" />

  <text x="90" y="191" class="title">Browser</text>

  <text x="90" y="216" class="text">React client</text>

  <text x="90" y="237" class="text">Router + UI</text>

  <rect x="370" y="155" width="260" height="95" rx="16" class="box" />

  <text x="410" y="191" class="title">src/main.tsx</text>

  <text x="410" y="216" class="text">App entry / RouterProvider</text>

  <text x="410" y="237" class="text">Global CSS imports</text>

  <rect x="680" y="155" width="260" height="95" rx="16" class="box" />

  <text x="725" y="191" class="title">src/App.tsx</text>

  <text x="725" y="216" class="text">Layout wrapper</text>

  <text x="725" y="237" class="text">Header / Footer / Outlet</text>

  <!-- Main flow arrows -->
  <line x1="320" y1="202" x2="370" y2="202" class="line" />

  <line x1="630" y1="202" x2="680" y2="202" class="line" />

  <!-- Application modules -->
  <rect x="60" y="310" width="260" height="120" rx="16" class="box" />

  <text x="90" y="347" class="title">src/router.tsx</text>

  <text x="90" y="374" class="text">Route definitions</text>

  <text x="90" y="396" class="text">Navigation config</text>

  <rect x="370" y="310" width="260" height="120" rx="16" class="box" />

  <text x="410" y="347" class="title">src/pages/</text>

  <text x="410" y="374" class="text">Home, Projects,</text>

  <text x="410" y="396" class="text">AboutMe, Contact</text>

  <rect x="680" y="310" width="260" height="120" rx="16" class="box" />

  <text x="720" y="347" class="title">src/features/</text>

  <text x="720" y="374" class="text">Nav links, buttons,</text>

  <text x="720" y="396" class="text">project cards, forms</text>

  <!-- Vertical relationships -->
  <line x1="190" y1="250" x2="190" y2="310" class="line" />

  <line x1="500" y1="250" x2="500" y2="310" class="line" />

  <line x1="810" y1="250" x2="810" y2="310" class="line" />

  <!-- Supporting layer -->
  <rect x="60" y="490" width="260" height="120" rx="16" class="section" />

  <text x="90" y="527" class="title">Data &amp; config</text>

  <text x="90" y="554" class="text">Navigation, buttons, socials</text>

  <text x="90" y="576" class="text">Project list / constants</text>

  <text x="90" y="598" class="text">Route titles and labels</text>

  <rect x="370" y="490" width="260" height="120" rx="16" class="section" />

  <text x="400" y="527" class="title">Utilities</text>

  <text x="400" y="554" class="text">Hooks, helpers,</text>

  <text x="400" y="576" class="text">responsive behavior</text>

  <text x="400" y="598" class="text">page title + scroll reset</text>

  <rect x="680" y="490" width="260" height="120" rx="16" class="section" />

  <text x="710" y="527" class="title">Styling &amp; state</text>

  <text x="710" y="554" class="text">Tailwind + RippleUI +</text>

  <text x="710" y="576" class="text">CSS variables / dark mode</text>

  <text x="710" y="598" class="text">Theme provider / localStorage</text>

  <!-- Supporting relationships -->
  <line x1="190" y1="430" x2="190" y2="490" class="line" />

  <line x1="500" y1="430" x2="500" y2="490" class="line" />

  <line x1="810" y1="430" x2="810" y2="490" class="line" />
</svg>
